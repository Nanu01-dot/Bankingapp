apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: local/banking/service-registry:latest
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: banking
spec:
  selector:
    app: service-registry
  type: NodePort
  ports:
    - port: 8761
      targetPort: 8761
      nodePort: 30761
