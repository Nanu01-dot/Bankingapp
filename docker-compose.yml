services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking}
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
  service-registry:
    build:
      context: .
      dockerfile: backend/service-registry/Dockerfile
    ports:
      - "8761:8761"
  customer-service:
    build:
      context: .
      dockerfile: backend/customer-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-banking}
      DATABASE_USERNAME: ${POSTGRES_USER:-banking}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
  account-service:
    build:
      context: .
      dockerfile: backend/account-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-banking}
      DATABASE_USERNAME: ${POSTGRES_USER:-banking}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_started
      customer-service:
        condition: service_started
      account-service:
        condition: service_started
    ports:
      - "8088:8080"
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
volumes:
  postgres-data:
